name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "星渊引-V18-竹影寒刃-20260729.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare game files
        shell: bash
        run: |
          set -euo pipefail
          archive="星渊引-V18-竹影寒刃-20260729.zip"
          mkdir -p extracted site
          unzip -q "$archive" -d extracted
          game_dir="$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$game_dir"
          cp -R "$game_dir"/. site/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
